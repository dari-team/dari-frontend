name: Mirror main to personal Vercel repo

# Vercel Hobby plan cannot connect to private org repos, so we mirror
# every push on `main` to george20033/dari-frontend, which Vercel watches.
# Whoever owns the deploy target should rotate MIRROR_TOKEN yearly.

on:
  push:
    branches: [main]
  workflow_dispatch: {}  # allow manual re-mirror from the Actions tab

concurrency:
  group: mirror-to-personal
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the destination ref isn't ahead

      - name: Debug token presence
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          # Print only the length and prefix, never the value.
          echo "MIRROR_TOKEN length: ${#MIRROR_TOKEN}"
          echo "MIRROR_TOKEN starts with: ${MIRROR_TOKEN:0:11}..."
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::MIRROR_TOKEN secret is EMPTY"
            exit 1
          fi
          # Test if the token can authenticate at all.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $MIRROR_TOKEN" \
            https://api.github.com/repos/george20033/dari-frontend)
          echo "GitHub API status: $status (expected 200)"

      - name: Push to george20033/dari-frontend
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -e
          # Use an Authorization header instead of embedding the token in the URL.
          # This avoids any issues with URL escaping / credential helpers.
          auth_header=$(printf 'x-access-token:%s' "$MIRROR_TOKEN" | base64 -w0)
          git -c "http.https://github.com/george20033/dari-frontend.git/.extraheader=Authorization: Basic $auth_header" \
              push --force \
              https://github.com/george20033/dari-frontend.git \
              HEAD:main
